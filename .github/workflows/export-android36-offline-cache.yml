name: Export Complete Android Runtime Cache

on:
  push:
    branches:
      - ci-export-android36-cache
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-runtime-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Match AviaSNG fixed runtime dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('gradle/libs.versions.toml')
          s = p.read_text()
          s = s.replace('lifecycle = "2.9.2"', 'lifecycle = "2.9.4"')
          s = s.replace('version = "1.12.0"', 'version = "1.14.0"')
          p.write_text(s)

          p = Path('app/build.gradle.kts')
          s = p.read_text()
          if 'androidx.activity:activity-ktx:1.13.0' not in s:
              s = s.replace('// AndroidX', '// AndroidX\n    implementation("androidx.activity:activity-ktx:1.13.0")')
          p.write_text(s)
          PY

      - name: Resolve all external Basic Debug runtime artifacts
        run: |
          chmod +x gradlew
          cat >> app/build.gradle.kts <<'EOF'

          tasks.register("resolveExternalBasicDebugRuntime") {
              doLast {
                  val cfg = configurations.getByName("basicDebugRuntimeClasspath")
                  val view = cfg.incoming.artifactView {
                      componentFilter {
                          it is org.gradle.api.artifacts.component.ModuleComponentIdentifier
                      }
                  }
                  view.artifactFiles.files.sortedBy { it.name }.forEach { println(it.absolutePath) }
              }
          }
          EOF
          ./gradlew --no-daemon :app:resolveExternalBasicDebugRuntime

      - name: Package resolved Gradle modules cache
        run: |
          tar -C "$HOME/.gradle/caches" --use-compress-program='zstd -3 -T0' -cf runtime-modules-cache.tar.zst modules-2
          split -b 450M -d -a 2 runtime-modules-cache.tar.zst runtime-cache-part-
          ls -lh runtime-cache-part-*

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: runtime-cache-part-00
          path: runtime-cache-part-00
          compression-level: 0
          retention-days: 2

      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: runtime-cache-part-01
          path: runtime-cache-part-01
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 2

      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: runtime-cache-part-02
          path: runtime-cache-part-02
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 2
