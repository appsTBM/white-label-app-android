name: Export Missing Gradle Dependencies

on:
  push:
    branches:
      - ci-export-android36-cache
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve exact missing dependencies
        run: |
          chmod +x gradlew
          mkdir -p "$RUNNER_TEMP/deps"
          cat > "$RUNNER_TEMP/deps/settings.gradle" <<'EOF'
          rootProject.name = 'deps'
          EOF
          cat > "$RUNNER_TEMP/deps/build.gradle" <<'EOF'
          repositories {
              google()
              mavenCentral()
          }
          configurations { deps }
          dependencies {
              deps 'com.google.android.gms:play-services-ads-identifier:18.0.0'
              deps 'androidx.lifecycle:lifecycle-common-jvm:2.9.0'
              deps 'androidx.lifecycle:lifecycle-runtime-android:2.9.0'
              deps 'androidx.lifecycle:lifecycle-viewmodel-android:2.9.0'
              deps 'androidx.lifecycle:lifecycle-runtime-ktx-android:2.9.0'
          }
          tasks.register('resolveDeps') {
              doLast {
                  configurations.deps.resolve().each { println it }
              }
          }
          EOF
          cd "$RUNNER_TEMP/deps"
          "$GITHUB_WORKSPACE/gradlew" --no-daemon --gradle-user-home "$RUNNER_TEMP/gradlehome" resolveDeps
      - name: Package dependency cache
        run: |
          tar -C "$RUNNER_TEMP/gradlehome" --use-compress-program='zstd -3 -T0' -cf missing-gradle-deps.tar.zst caches/modules-2
          ls -lh missing-gradle-deps.tar.zst
      - name: Upload dependency cache
        uses: actions/upload-artifact@v4
        with:
          name: missing-gradle-deps
          path: missing-gradle-deps.tar.zst
          compression-level: 0
          retention-days: 2
