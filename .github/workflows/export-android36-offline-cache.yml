name: Export Android 36 Offline Cache

on:
  push:
    branches:
      - ci-export-android36-cache
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore JDK and Gradle cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Package and split Gradle cache
        run: |
          du -sh "$HOME/.gradle" || true
          tar -C "$HOME" --use-compress-program='zstd -3 -T0' -cf gradle-offline-cache.tar.zst \
            .gradle/caches \
            .gradle/wrapper/dists
          split -b 450M -d -a 2 gradle-offline-cache.tar.zst gradle-cache-part-
          ls -lh gradle-cache-part-*

      - name: Upload Gradle cache part 00
        uses: actions/upload-artifact@v4
        with:
          name: gradle-cache-part-00
          path: gradle-cache-part-00
          compression-level: 0
          retention-days: 2

      - name: Upload Gradle cache part 01
        uses: actions/upload-artifact@v4
        with:
          name: gradle-cache-part-01
          path: gradle-cache-part-01
          compression-level: 0
          retention-days: 2

      - name: Upload Gradle cache part 02
        uses: actions/upload-artifact@v4
        with:
          name: gradle-cache-part-02
          path: gradle-cache-part-02
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 2
