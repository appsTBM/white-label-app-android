name: Export Android Build Tools 35

on:
  push:
    branches:
      - ci-export-android36-cache
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-build-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install and package Build Tools 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;35.0.0"
          tar -C "$ANDROID_SDK_ROOT" --use-compress-program='zstd -3 -T0' -cf android-build-tools-35.tar.zst build-tools/35.0.0
          ls -lh android-build-tools-35.tar.zst
      - name: Upload Build Tools 35
        uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-35
          path: android-build-tools-35.tar.zst
          compression-level: 0
          retention-days: 2
