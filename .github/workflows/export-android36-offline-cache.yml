name: Export Appodeal Runtime Jars

on:
  push:
    branches:
      - ci-export-android36-cache
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-jars:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve Appodeal runtime jars
        run: |
          chmod +x gradlew
          mkdir -p "$RUNNER_TEMP/deps"
          cat > "$RUNNER_TEMP/deps/settings.gradle" <<'EOF'
          rootProject.name = 'deps'
          EOF
          cat > "$RUNNER_TEMP/deps/build.gradle" <<'EOF'
          repositories {
              mavenCentral()
              maven { url 'https://artifactory.appodeal.com/appodeal' }
              maven { url 'https://artifactory.bidmachine.io/bidmachine' }
          }
          configurations { deps }
          dependencies {
              deps 'com.explorestack:protobuf-java:3.16.0'
              deps 'com.appodeal:protobuf-models:1.4.3'
          }
          tasks.register('copyDeps', Copy) {
              from configurations.deps
              into layout.buildDirectory.dir('jars')
          }
          EOF
          cd "$RUNNER_TEMP/deps"
          "$GITHUB_WORKSPACE/gradlew" --no-daemon copyDeps
          ls -lh build/jars
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: appodeal-runtime-jars
          path: ${{ runner.temp }}/deps/build/jars/
          retention-days: 2
